# ============================================================
#  tmux.conf
#  Part of: dotfiles/tmux
# ============================================================

# ── Prefix ───────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ──────────────────────────────────────────────
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 10000
set -g mouse on
set -sg escape-time 0          # no delay for escape key
set -g base-index 1            # start window index at 1
setw -g pane-base-index 1      # start pane index at 1
set -g renumber-windows on     # renumber on close

# ── Reload config ────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ── Splits ───────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Navigation (set by installer) ────────────────────────
# TMUX_KEYS_PLACEHOLDER

# ── Status bar ───────────────────────────────────────────
set -g status-position bottom
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left '#[fg=#89b4fa,bold] #S '
set -g status-right '#[fg=#a6e3a1] %H:%M #[fg=#89b4fa] %d-%m-%Y '
set -g status-left-length 20
set -g status-right-length 40

setw -g window-status-current-style 'fg=#1e1e2e bg=#89b4fa bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-style 'fg=#cdd6f4'
setw -g window-status-format ' #I:#W '

# ── Pane borders ─────────────────────────────────────────
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# ── Copy mode ────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
